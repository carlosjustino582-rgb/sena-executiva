<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Redefinir palavra-passe | SENA EXECUTIVA</title>
  <style>
    :root{--navy:#0F1F4E;--gold:#F5C24B;--line:#e3e8f2;--muted:#61718a;} 
    *{box-sizing:border-box} body{margin:0;font-family:Inter,'Segoe UI',sans-serif;background:#f5f7fb;color:#111d37} .wrap{max-width:460px;margin:12vh auto;padding:30px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 16px 44px rgba(15,31,78,.08)} h1{margin:0 0 12px;font-size:30px} p{color:var(--muted)} label{display:block;margin:16px 0 8px;font-weight:700;font-size:13px} input{width:100%;padding:12px 14px;border:1px solid #dfe5f0;border-radius:10px;font:inherit} button{width:100%;margin-top:18px;padding:12px 18px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer} .error,.ok{min-height:20px;margin-top:12px;font-size:13px} .error{color:#aa2e2e}.ok{color:#0d7f4f}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Redefinir palavra-passe</h1>
    <p>Crie uma nova palavra-passe para continuar o acesso ao painel.</p>
    <form id="resetForm">
      <label>Nova palavra-passe</label>
      <input id="password" name="password" type="password" minlength="12" required>
      <button type="submit">Guardar nova palavra-passe</button>
      <div id="message" class="ok" aria-live="polite"></div>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      message.className = 'ok';

      if (!token) {
        message.className = 'error';
        message.textContent = 'Token inválido ou ausente.';
        return;
      }

      const password = document.getElementById('password').value;
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password })
      });
      const data = await res.json();

      if (!res.ok) {
        message.className = 'error';
        message.textContent = data.error || 'Não foi possível redefinir a palavra-passe.';
        return;
      }

      message.textContent = data.message || 'Palavra-passe redefinida com sucesso.';
      setTimeout(() => window.location.href = '/admin', 1200);
    });
  </script>
</body>
</html>
